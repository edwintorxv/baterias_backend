#############################################################
# APPLICATION NANME
#############################################################
spring.application.name=riesgo-psicosocial
# Secretos por ambiente: .env en la raíz del proyecto o, en Render, el Secret File /etc/secrets/.env
# (plantilla en .env.example). Las variables de entorno del sistema tienen prioridad.
spring.config.import=optional:file:.env[.properties],optional:file:/etc/secrets/.env[.properties]
#############################################################
# SERVER
#############################################################
# Render indica el puerto en PORT
server.port=${PORT:8080}
server.servlet.context-path=/api

#############################################################
# PORFILES
#############################################################
spring.profiles.active=dev

#############################################################
# POSTGRESQL (el perfil dev trae la BD local)
#############################################################
spring.datasource.url=${BD_URL:}
spring.datasource.username=${BD_USUARIO:}
spring.datasource.password=${BD_CONTRASENA:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

#############################################################
# JPA
#############################################################
spring.jpa.open-in-view=false

#############################################################
# JACKSON
#############################################################
spring.jackson.time-zone=America/Bogota
spring.jackson.serialization.write-dates-as-timestamps=false

#############################################################
# FLYWAY
#############################################################
#spring.flyway.enabled=true
#spring.flyway.locations=classpath:db/migration
spring.flyway.repair-on-migrate=false

#############################################################
# LOGGING
#############################################################
logging.config=classpath:logback-spring.xml

#############################################################
# SWAGGER
#############################################################
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

#############################################################
# CONTROL-ARCHIVOS
#############################################################
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
# Seguridad: el secreto firma los tokens (HS256, al menos 32 caracteres). Se toma de la variable
# de entorno; sin él la app no arranca. Solo el perfil dev trae uno propio (application-dev.properties).
app.seguridad.jwt.secreto=${APP_SEGURIDAD_JWT_SECRETO:}
app.seguridad.jwt.duracion=8h
# Primer administrador: se crea al arrancar solo si la tabla usuario está vacía.
app.seguridad.admin.correo=${APP_SEGURIDAD_ADMIN_CORREO:}
app.seguridad.admin.contrasena=${APP_SEGURIDAD_ADMIN_CONTRASENA:}
# Fuerza bruta en el login: tras tantos fallos seguidos (por usuario o por IP) se bloquea durante
# 'bloqueo' desde el último fallo. Detrás de un proxy hay que activar server.forward-headers-strategy
# para que la IP sea la del cliente y no la del proxy.
app.seguridad.login.max-intentos-usuario=5
app.seguridad.login.max-intentos-ip=20
app.seguridad.login.bloqueo=15m
# Mensajes de validación siempre en español (sin esto dependen del Accept-Language: curl, Swagger u
# otros clientes los reciben en inglés).
spring.web.locale=es
spring.web.locale-resolver=fixed

# CORS: orígenes del front que pueden llamar la API, separados por coma (admite patrones como
# https://*.midominio.com). Sin valor no se acepta ningún origen externo.
app.cors.origenes=${APP_CORS_ORIGENES:}
