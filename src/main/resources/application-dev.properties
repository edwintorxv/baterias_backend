####################################################
# POSTGRESQL
####################################################
spring.datasource.url=jdbc:postgresql://localhost:5432/bateria_psicosocial

spring.datasource.username=postgres
spring.datasource.password=1234

spring.datasource.driver-class-name=org.postgresql.Driver

####################################################
# JPA
####################################################
spring.jpa.show-sql=true

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota
####################################################
# SEGURIDAD (solo desarrollo local; en otros ambientes va por APP_SEGURIDAD_JWT_SECRETO)
####################################################
app.seguridad.jwt.secreto=dev-local-solo-para-desarrollo-no-usar-en-produccion
# Front en desarrollo: cualquier puerto de localhost (Angular 4200, Vite 5173, React 3000…)
app.cors.origenes=http://localhost:[*],http://127.0.0.1:[*]
