<!DOCTYPE html>
<!--/* Marco de todos los correos. Estilos en línea: Gmail y Outlook ignoran las hojas de estilo. */-->
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${asunto}">PsicoBatería</title>
</head>
<body style="margin:0;padding:24px 12px;background:#f1f5f9;font-family:Arial,Helvetica,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"
       style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #e2e8f0;border-radius:8px;">
    <tr>
        <td style="background:#1e3a8a;padding:16px 24px;border-radius:8px 8px 0 0;font-size:20px;font-weight:bold;color:#ffffff;">
            Psico<span style="color:#93c5fd;">Batería</span>
        </td>
    </tr>
    <tr>
        <td style="padding:24px;color:#0f172a;font-size:14px;line-height:1.6;" th:utext="${cuerpo}"></td>
    </tr>
    <tr>
        <td style="background:#f8fafc;padding:12px 24px;border-top:1px solid #e2e8f0;border-radius:0 0 8px 8px;color:#64748b;font-size:12px;">
            Mensaje automático de PsicoBatería. Por favor no responda a este correo.
        </td>
    </tr>
</table>
</body>
</html>
