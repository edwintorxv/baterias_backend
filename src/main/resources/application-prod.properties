####################################################
# PRODUCCIÓN (Render + Supabase). Secretos en el .env (ver .env.example).
####################################################
# Render pone un proxy delante: sin esto la IP del cliente sería la del proxy (límite de intentos
# de login por IP) y las URL saldrían con http.
server.forward-headers-strategy=native

# Supabase gratis limita las conexiones del pooler
spring.datasource.hikari.maximum-pool-size=5

# Swagger apagado en producción
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
